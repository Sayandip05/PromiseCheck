services:
  # ============================================================================
  # Local Database: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: promisecheck_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: promisecheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d promisecheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Local Cache & Task Broker: Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: promisecheck_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Backend API: FastAPI Server
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: promisecheck_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/promisecheck
      REDIS_URL: redis://redis:6379/0
      PUBLIC_APP_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8000
    volumes:
      - ./backend:/app
      - ./requirements.txt:/app/requirements.txt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # Celery Background Worker
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: promisecheck_worker
    restart: unless-stopped
    command: ["celery", "-A", "entrypoints.worker", "worker", "--loglevel=info"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/promisecheck
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./requirements.txt:/app/requirements.txt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # Frontend Web App: Vite + React
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: promisecheck_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
