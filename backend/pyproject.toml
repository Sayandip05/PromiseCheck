[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promisecheck"
version = "0.1.0"
description = "Customer commitments, connected from conversation to verified delivery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "python-dateutil>=2.9.0",
    "bcrypt>=4.2.0",
    "pyjwt[crypto]>=2.10.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
    "fastmcp>=4.0.0",
    "google-auth>=2.20.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.importlinter]
root_packages = [
    "core",
    "connectors",
    "ai",
    "jobs",
    "modules",
    "api",
]

[[tool.importlinter.contracts]]
name = "Layered Architecture"
type = "layers"
layers = [
    "api",
    "modules",
    "jobs",
    "connectors | ai",
    "core",
]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "No cycles between modules"
type = "acyclic_siblings"
ancestors = ["modules"]

[[tool.importlinter.contracts]]
name = "Encapsulate iam module internals"
type = "protected"
protected_modules = [
    "modules.iam.models",
    "modules.iam.service",
    "modules.iam.dependencies",
    "modules.iam.schemas",
    "modules.iam.tasks",
]
allowed_importers = [
    "modules.iam",
]

[[tool.importlinter.contracts]]
name = "Encapsulate audit module internals"
type = "protected"
protected_modules = [
    "modules.audit.models",
    "modules.audit.service",
]
allowed_importers = [
    "modules.audit",
]

[[tool.importlinter.contracts]]
name = "Encapsulate integrations module internals"
type = "protected"
protected_modules = [
    "modules.integrations.models",
    "modules.integrations.service",
]
allowed_importers = [
    "modules.integrations",
]

[[tool.importlinter.contracts]]
name = "Encapsulate customers module internals"
type = "protected"
protected_modules = [
    "modules.customers.models",
    "modules.customers.service",
]
allowed_importers = [
    "modules.customers",
]

[[tool.importlinter.contracts]]
name = "Encapsulate notifications module internals"
type = "protected"
protected_modules = [
    "modules.notifications.service",
    "modules.notifications.tasks",
]
allowed_importers = [
    "modules.notifications",
]

[[tool.importlinter.contracts]]
name = "Encapsulate ingestion module internals"
type = "protected"
protected_modules = [
    "modules.ingestion.models",
    "modules.ingestion.service",
    "modules.ingestion.tasks",
]
allowed_importers = [
    "modules.ingestion",
]

[[tool.importlinter.contracts]]
name = "Encapsulate commitments module internals"
type = "protected"
protected_modules = [
    "modules.commitments.models",
    "modules.commitments.service",
    "modules.commitments.schemas",
    "modules.commitments.delivery",
    "modules.commitments.risk",
    "modules.commitments.tickets",
]
allowed_importers = [
    "modules.commitments",
]


