services:
  test_postgres:
    image: postgres:16-alpine
    container_name: promisecheck_test_postgres
    restart: "no"
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: promisecheck_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d promisecheck_test"]
      interval: 2s
      timeout: 2s
      retries: 10

  test_redis:
    image: redis:7-alpine
    container_name: promisecheck_test_redis
    restart: "no"
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
